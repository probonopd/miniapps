# Builds all mini apps for 32-bit ARM, 64-bit ARM and Intel (x86_64) and, on main, publishes them as a GitHub
# release that Obtainium can follow: one release per run, tag v1.0.<run>, one APK per app and ABI
# (<app>-<version>-<abi>.apk; minicaptive has no native code and comes as one <app>-<version>.apk).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIGLANG: "0.17.0"
  MESON: "1.12.0"
  APKTOOL: "2.9.3"

jobs:
  minicall-helper:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7, arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config >/dev/null
          pip install -q "ziglang==$ZIGLANG" "meson==$MESON"
          echo "ZIG=$(python -c 'import ziglang, os; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')" >> "$GITHUB_ENV"
      - name: Cache downloads and build
        uses: actions/cache@v4
        with:
          path: |
            minicall/helper/dl
            minicall/helper/out/${{ matrix.arch }}
          key: helper-${{ matrix.arch }}-${{ hashFiles('minicall/helper/**', '!minicall/helper/out/**') }}
      - run: minicall/helper/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: minicall-helper-${{ matrix.arch }}
          path: minicall/helper/out/${{ matrix.arch }}/baresip
          if-no-files-found: error

  minisshd-native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7, arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu >/dev/null
      - run: |
          minisshd/dropbear/build.sh ${{ matrix.arch }}
          minisshd/sftp-server/build.sh ${{ matrix.arch }}
          mkdir -p native/${{ matrix.arch }}
          cp minisshd/dropbear/out/${{ matrix.arch }}/dropbear minisshd/dropbear/out/${{ matrix.arch }}/dropbearkey \
            minisshd/sftp-server/out/${{ matrix.arch }}/sftp-server native/${{ matrix.arch }}/
      - uses: actions/upload-artifact@v4
        with:
          name: minisshd-native-${{ matrix.arch }}
          path: native/${{ matrix.arch }}
          if-no-files-found: error

  apks:
    needs: [minicall-helper, minisshd-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install -q cryptography
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL/apktool_$APKTOOL.jar"
          printf '#!/bin/sh\nexec java -jar "%s/bin/apktool.jar" "$@"\n' "$HOME" > "$HOME/bin/apktool"
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Cache Maven downloads
        uses: actions/cache@v4
        with:
          path: |
            minitv/build/libs
            minicall/build/libs
            minisshd/build/libs
            minicaptive/build/libs
          key: libs-${{ hashFiles('*/libs.sha256') }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Native parts into place
        run: |
          for a in armv7 arm64 x86_64; do
            mkdir -p minicall/helper/out/$a minisshd/dropbear/out/$a minisshd/sftp-server/out/$a
            install -m 755 artifacts/minicall-helper-$a/baresip minicall/helper/out/$a/baresip
            install -m 755 artifacts/minisshd-native-$a/dropbear artifacts/minisshd-native-$a/dropbearkey \
              minisshd/dropbear/out/$a/
            install -m 755 artifacts/minisshd-native-$a/sftp-server minisshd/sftp-server/out/$a/
          done
      # The one key all apps share: Android installs an update only over an app signed with the same key, and
      # minicall trusts minitv by it. Not available to pull requests from forks: those get a throwaway key.
      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.MINIAPPS_SIGNING_KEY }}
        run: |
          mkdir -p keys
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > keys/signing-key.pem
          fi
      - name: Build
        env:
          APK_SPLIT: "1"
          ARCHS: armv7 arm64 x86_64
        run: |
          export APK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) APK_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "VERSION=$APK_VERSION_NAME" >> "$GITHUB_ENV"
          sh minitv/build.sh
          sh minicall/build.sh
          sh minisshd/build.sh
          sh minicaptive/build.sh
      - name: Collect
        run: |
          mkdir dist
          for app in minitv minicall minisshd; do
            for abi in armeabi-v7a arm64-v8a x86_64; do
              cp "$app/$app-$abi.apk" "dist/$app-$VERSION-$abi.apk"
            done
          done
          cp minicaptive/minicaptive.apk "dist/minicaptive-$VERSION.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ env.VERSION }}
          path: dist
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.apk --target "$GITHUB_SHA" --title "miniapps $VERSION" --notes \
            "Built from $GITHUB_SHA. One APK per app and processor: armeabi-v7a (32-bit ARM), arm64-v8a (64-bit ARM), x86_64 (Intel); minicaptive runs on all. Obtainium: add https://github.com/$GITHUB_REPOSITORY once per app with \"Filter APKs by regular expression\" set to the app's name, e.g. ^minicall-."
